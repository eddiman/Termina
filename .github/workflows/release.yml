name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Termina ${{ github.ref_name }}'
          releaseBody: |
            ## Install

            1. Download and extract `Termina_aarch64.app.tar.gz`
            2. Move `Termina.app` to `/Applications`
            3. Remove the quarantine flag (required for unsigned apps):
               ```
               xattr -cr /Applications/Termina.app
               ```
            4. Open Termina
          releaseDraft: false
          prerelease: false
